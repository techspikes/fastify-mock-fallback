openapi: 3.0.4
info:
  title: Petstore User Login Partial Examples
  version: 1.0.27
paths:
  /user/login:
    get:
      tags:
        - user
      summary: Logs user into the system.
      operationId: loginUser
      parameters:
        - in: query
          name: password
          schema:
            type: string
            minLength: 1
        - in: query
          name: username
          schema:
            type: string
            minLength: 1
          examples:
            user1:
              value: user1
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: string
                description: Login session token.
              examples:
                user1:
                  x-request-match: user1
                  value: logged-in-token
