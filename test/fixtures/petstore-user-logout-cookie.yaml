openapi: 3.0.4
info:
  title: Petstore User Logout Cookie
  version: 1.0.27
paths:
  /user/logout:
    get:
      tags:
        - user
      summary: Logs out current logged in user session.
      operationId: logoutUser
      parameters:
        - in: cookie
          name: session
          schema:
            type: string
            minLength: 1
          examples:
            valid-session:
              value: petstore-session
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                valid-session:
                  x-request-match: valid-session
                  value:
                    message: User logged out
components:
  schemas:
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
