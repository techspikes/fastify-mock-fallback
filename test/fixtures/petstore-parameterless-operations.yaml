openapi: 3.0.4
info:
  title: Petstore Parameterless Response
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetPreviewList"
              example:
                - id: 1
                  name: rocky
  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
              - archived
          examples:
            available:
              value: available
      responses:
        "200":
          description: available pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetStatusList"
              examples:
                available:
                  x-request-match: available
                  value:
                    - id: 10
                      status: available
  /pets/cache:
    delete:
      operationId: clearPetsCache
      responses:
        "204":
          description: no content
  /pets/redirect-info:
    get:
      operationId: getPetsRedirectInfo
      responses:
        "200":
          description: successful operation without examples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetSummary"
        "302":
          description: redirect information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetRedirect"
              example:
                location: /pets
  /pets/empty-examples:
    get:
      operationId: getPetsEmptyExamples
      responses:
        "200":
          description: successful operation with empty examples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetSummary"
              examples: {}
  /pets/summary:
    get:
      operationId: summarizePets
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetSummary"
              example:
                count: 1
  /pets/featured:
    get:
      operationId: listFeaturedPets
      responses:
        "200":
          description: successful operation
          content:
            text/plain:
              schema:
                type: string
              examples:
                fallback:
                  value: plain featured pet
            application/json:
              schema:
                $ref: "#/components/schemas/PetPreviewList"
              examples:
                rocky:
                  value:
                    - id: 1
                      name: rocky
                daisy:
                  value:
                    - id: 2
                      name: daisy
components:
  schemas:
    PetPreviewList:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
    PetStatusList:
      type: array
      items:
        type: object
        required:
          - id
          - status
        properties:
          id:
            type: integer
            format: int64
          status:
            type: string
            enum:
              - available
              - pending
              - sold
    PetSummary:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
    PetRedirect:
      type: object
      required:
        - location
      properties:
        location:
          type: string
