openapi: 3.0.4
info:
  title: Petstore Operations Without Examples
  version: 1.0.27
paths:
  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status.
      operationId: getInventory
      responses:
        "200":
          description: successful operation
  /user:
    post:
      tags:
        - user
      summary: Create user.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /user/{username}:
    get:
      tags:
        - user
      summary: Get user by user name.
      operationId: getUserByName
      parameters:
        - in: path
          name: username
          schema:
            type: string
            minLength: 1
          required: true
          examples:
            user1:
              value: user1
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                user1:
                  x-request-match: user1
                  value:
                    id: 10
                    username: user1
                    firstName: John
                    lastName: Smith
components:
  schemas:
    UserCreate:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    User:
      type: object
      required:
        - id
        - username
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
