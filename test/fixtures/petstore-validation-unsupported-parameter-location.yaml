openapi: 3.0.4
info:
  title: Petstore Unsupported Parameter Location
  version: 1.0.27
paths:
  /pet:
    get:
      tags:
        - pet
      summary: Unsupported parameter location fixture.
      operationId: findPetsByColor
      parameters:
        - in: params
          name: color
          schema:
            type: string
            enum:
              - red
          required: true
          examples:
            red:
              value: red
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"
              examples:
                red:
                  x-request-match: red
                  value:
                    - id: 10
                      name: doggie
                      photoUrls:
                        - https://example.com/doggie.png
                      status: available
components:
  schemas:
    PetList:
      type: array
      items:
        type: object
        required:
          - id
          - name
          - photoUrls
          - status
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
          photoUrls:
            type: array
            items:
              type: string
              format: uri
          status:
            type: string
            enum:
              - available
              - pending
              - sold
