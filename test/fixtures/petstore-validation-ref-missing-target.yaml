openapi: 3.0.4
info:
  title: Petstore Ref Missing Target
  version: 1.0.0
paths:
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResource"
              examples:
                pet:
                  value:
                    id: 1
components:
  schemas:
    IdResource:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
