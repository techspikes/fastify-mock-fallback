openapi: 3.0.4
info:
  title: Petstore Query Parameter
  version: 1.0.27
paths:
  /pet/findByStatus:
    get:
      tags:
        - pet
      summary: Finds Pets by status.
      operationId: findPetsByStatus
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
          examples:
            available:
              value: available
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"
              examples:
                available:
                  x-request-match: available
                  value:
                    - id: 10
                      name: doggie
                      photoUrls:
                        - https://example.com/doggie.png
                      status: available
components:
  schemas:
    PetList:
      type: array
      items:
        type: object
        required:
          - id
          - name
          - photoUrls
          - status
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
          photoUrls:
            type: array
            items:
              type: string
              format: uri
          status:
            type: string
            enum:
              - available
              - pending
              - sold
